    --bg-elevated: #1e1830;
    --surface: #241d38;
    --surface-hover: #2b2342;
    --hairline: #372c52;
    --text-primary: #f2eef7;
    --text-secondary: #a99fc0;
    --text-faint: #6e6288;
    --accent-cyan: #4ce0d2;
    --accent-magenta: #ff3ea5;
    --score-high: #4ce07a;
    --score-mid-high: #4ce0d2;
    --score-mid: #f4c542;
    --score-low: #ff5c6e;
    --tag-jarang: #f4c542;
    --tag-bright: #4fc3e8;
    --tag-fun: #ff5c7a;
    --tag-calm: #7ed6a5;
    --tag-warmup: #b48ef0;
    --tag-oldies: #e0965a;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 600px 300px at 15% -5%, rgba(255,62,165,0.12), transparent 60%),
      radial-gradient(ellipse 600px 400px at 90% 0%, rgba(76,224,210,0.10), transparent 60%),
      var(--bg);
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 100px;
    position: relative;
  }

  /* ---------- Header ---------- */
  header.top {
    padding: 28px 20px 16px;
  }
  .kicker {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--accent-magenta);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1.title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 10px;
    color: var(--text-primary);
  }
  h1.title .count {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .gear-btn {
    position: absolute;
    top: 30px;
    right: 20px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--text-secondary);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 17px;
    transition: transform 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .gear-btn:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); transform: rotate(25deg); }

  /* ---------- Search ---------- */
  .search-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 20px 14px;
    padding: 0 12px;
    background: var(--surface);
    border: 1.5px solid var(--hairline);
    border-radius: var(--radius-sm);
    transition: border-color 0.15s ease;
  }
  .search-row:focus-within { border-color: var(--accent-cyan); }
  .search-icon { font-size: 13px; opacity: 0.6; }
  .search-input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    padding: 11px 0;
  }
  .search-input::placeholder { color: var(--text-faint); }
  .search-clear {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 14px;
    cursor: pointer;
    padding: 4px;
  }
  .search-clear:hover { color: var(--accent-magenta); }

  /* ---------- Filter chips ---------- */
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 20px 14px;
  }

  .chip {
    flex: none;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    border: 1.5px solid var(--hairline);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--chip-color, var(--text-faint));
  }
  .chip.active {
    color: #16121f;
    background: var(--chip-color, var(--accent-cyan));
    border-color: var(--chip-color, var(--accent-cyan));
    font-weight: 700;
  }
  .chip.active .dot { background: #16121f; }
  .chip.all.active {
    background: var(--text-primary);
    border-color: var(--text-primary);
  }
  .chip.chip-subtle {
    opacity: 0.5;
    font-size: 11.5px;
    padding: 6px 11px;
  }
  .chip.chip-subtle.active {
    opacity: 1;
    font-size: 13px;
    padding: 8px 14px;
    font-weight: 700;
  }

  /* ---------- Sort control ---------- */
  .io-row {
    display: flex;
    gap: 8px;
    padding: 0 20px 14px;
  }
  .io-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px;
    border-radius: var(--radius-sm);
    background: var(--surface);
    border: 1.5px solid var(--hairline);
    color: var(--text-secondary);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .io-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

  .sort-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 20px 16px;
  }
  .sort-label {
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.02em;
  }
  .sort-tabs {
    display: flex;
    flex-wrap: nowrap;
    gap: 3px;
    background: var(--surface);
    border-radius: 999px;
    padding: 4px;
    border: 1px solid var(--hairline);
  }
  .sort-tab {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    padding: 7px 2px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
    flex: 1 1 0;
    min-width: 0;
    white-space: nowrap;
  }
  .sort-tab.active {
    background: var(--accent-magenta);
    color: #16121f;
    font-weight: 700;
  }

  /* ---------- List ---------- */
  .list-wrap { padding: 0 20px; }

  .group-header {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-faint);
    letter-spacing: 0.1em;
    padding: 14px 4px 8px;
    position: sticky;
    top: 0;
    background: linear-gradient(var(--bg) 70%, transparent);
    z-index: 2;
  }

  .song-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .song-card:hover { background: var(--surface-hover); border-color: var(--accent-cyan); }
  .song-card:active { transform: scale(0.99); }

  .heart-btn {
    flex: none;
    align-self: flex-start;
    background: none;
    border: none;
    padding: 2px 2px 2px 0;
    width: 22px;
    text-align: center;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    color: var(--text-faint);
    opacity: 0.55;
    transition: color 0.12s ease, opacity 0.12s ease;
  }
  .heart-btn:active { opacity: 0.8; }
  .heart-btn.on { color: var(--accent-magenta); opacity: 1; }

  .song-main { flex: 1; min-width: 0; }
  .song-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0 0 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-sub {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin: 0 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-sub .key { color: var(--text-faint); }
  .song-tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  .tag-pill {
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    color: #16121f;
    background: var(--pill-color, var(--text-faint));
  }

  .score-led {
    flex: none;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 22px;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: #0d0a15;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--hairline);
  }
  .score-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    flex: none;
  }
  .play-badge {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-faint);
  }

  /* ---------- Empty state ---------- */
  .empty-state {
    text-align: center;
    padding: 60px 30px;
    color: var(--text-secondary);
  }
  .empty-state .emoji { font-size: 40px; margin-bottom: 14px; }
  .empty-state .msg1 { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
  .empty-state .msg2 { font-size: 13px; color: var(--text-faint); }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(calc(-50% + 190px));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-magenta), #b3247d);
    border: none;
    color: white;
    font-size: 28px;
    font-weight: 300;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,62,165,0.35);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  .fab:hover { transform: translateX(calc(-50% + 190px)) scale(1.06); }
  @media (max-width: 480px) {
    .fab { transform: translateX(0); right: 20px; left: auto; }
    .fab:hover { transform: scale(1.06); }
  }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 16, 0.72);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal-sheet {
    background: var(--bg-elevated);
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 22px 22px 0 0;
    padding: 22px 20px 28px;
    transform: translateY(24px);
    transition: transform 0.25s ease;
    border-top: 1px solid var(--hairline);
  }
  .modal-backdrop.open .modal-sheet { transform: translateY(0); }

  .modal-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    font-weight: 400;
    margin: 0 0 18px;
  }

  .field-group { margin-bottom: 16px; }
  .field-label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field-input {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--hairline);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    padding: 11px 12px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field-input:focus { border-color: var(--accent-cyan); }

  .score-field-row { display: flex; align-items: center; gap: 14px; }
  .score-field-row input[type="range"] { flex: 1; accent-color: var(--accent-magenta); }
  .score-field-row.is-unset { opacity: 0.35; pointer-events: none; }
  .score-num {
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 18px;
    width: 46px;
    text-align: center;
  }
  .score-toggle-btn {
    margin-top: 8px;
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 0;
  }
  .score-toggle-btn:hover { color: var(--accent-cyan); }

  .playcount-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 4px 0 6px;
  }
  .count-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1.5px solid var(--hairline);
    background: var(--surface);
    color: var(--text-primary);
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .count-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
  .count-num {
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 28px;
    min-width: 56px;
    text-align: center;
  }

  .tag-select-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-check {
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    border: 1.5px solid var(--hairline);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }
  .tag-check.checked {
    color: #16121f;
    background: var(--chk-color, var(--accent-cyan));
    border-color: var(--chk-color, var(--accent-cyan));
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  .btn {
    flex: 1;
    padding: 13px;
    border-radius: var(--radius-sm);
    font-size: 14.5px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.88; }
  .btn.primary { background: var(--accent-magenta); color: #16121f; }
  .btn.ghost { background: var(--surface); color: var(--text-secondary); border: 1.5px solid var(--hairline); }
  .btn.danger { background: rgba(255,92,110,0.15); color: var(--score-low); border: 1.5px solid rgba(255,92,110,0.4); }

  /* ---------- Tag manager ---------- */
  .tag-manage-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--hairline);
  }
  .tag-manage-row:last-of-type { border-bottom: none; }
  .color-dot {
    width: 20px; height: 20px; border-radius: 50%;
    flex: none;
    background: var(--dot-color);
    border: 2px solid rgba(255,255,255,0.2);
  }
  .tag-manage-row input.field-input { padding: 8px 10px; font-size: 14px; }
  .icon-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 15px;
    cursor: pointer;
    padding: 6px;
  }
  .icon-btn:hover { color: var(--accent-cyan); }
  .icon-btn.remove:hover { color: var(--score-low); }

  .color-swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.selected { border-color: var(--text-primary); }

  .toast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--text-primary);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
</style>
</head>
<body>
<div id="app">
  <button class="gear-btn" id="gearBtn" title="설정">⚙</button>
  <header class="top">
    <p class="kicker">MY SETLIST</p>
    <h1 class="title"><span id="titleText">노래 리스트</span> <span class="count" id="songCount">0곡</span></h1>
  </header>

  <div class="search-row">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="text" placeholder="제목, 가수, 키, 태그 검색" />
    <button class="search-clear" id="searchClearBtn" style="display:none;">✕</button>
  </div>

  <div class="filter-row" id="filterRow"></div>

  <div class="sort-row">
    <span class="sort-label">정렬</span>
    <div class="sort-tabs" id="sortTabs">
      <button class="sort-tab" data-sort="alpha">가나다</button>
      <button class="sort-tab" data-sort="scoreDesc">높은점수</button>
      <button class="sort-tab" data-sort="scoreAsc">낮은점수</button>
      <button class="sort-tab" data-sort="playDesc">많이부른</button>
    </div>
  </div>

  <div class="list-wrap" id="listWrap"></div>
</div>

<button class="fab" id="addBtn">+</button>

<!-- Add/Edit Song Modal -->
<div class="modal-backdrop" id="songModalBackdrop">
  <div class="modal-sheet">
    <h2 class="modal-title" id="songModalTitle">노래 추가</h2>
    <div class="field-group">
      <label class="field-label">제목</label>
      <input class="field-input" id="inputTitle" placeholder="예: Golden" />
    </div>
    <div class="field-group">
      <label class="field-label">가수</label>
      <input class="field-input" id="inputArtist" placeholder="예: Huntr/X" />
    </div>
    <div class="field-group">
      <label class="field-label">키 변화</label>
      <input class="field-input" id="inputKey" placeholder="예: 여+2 Db" />
    </div>
    <div class="field-group">
      <label class="field-label">태그 (여러 개 선택 가능)</label>
      <div class="tag-select-wrap" id="tagSelectWrap"></div>
    </div>
    <div class="field-group">
      <label class="field-label">점수</label>
      <div class="score-field-row" id="scoreFieldRow">
        <input type="range" min="80" max="100" value="90" id="inputScoreRange" />
        <span class="score-num" id="scoreNumDisplay">90</span>
      </div>
      <button class="score-toggle-btn" id="scoreToggleBtn" type="button">점수 없음으로 표시</button>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelSongBtn">취소</button>
      <button class="btn danger" id="deleteSongBtn" style="display:none;">삭제</button>
      <button class="btn primary" id="saveSongBtn">저장</button>
    </div>
  </div>
</div>

<!-- Quick Edit Modal (부른 횟수 / 점수 / 태그만 빠르게 수정) -->
<div class="modal-backdrop" id="quickEditBackdrop">
  <div class="modal-sheet">
    <h2 class="modal-title" id="quickEditTitle">노래 제목</h2>

    <div class="field-group">
      <label class="field-label">부른 횟수</label>
      <div class="playcount-row">
        <button class="count-btn" id="qeDecBtn">−</button>
        <span class="count-num" id="qeCountDisplay">0</span>
        <button class="count-btn" id="qeIncBtn">+</button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">점수</label>
      <div class="score-field-row" id="qeScoreFieldRow">
        <input type="range" min="80" max="100" value="90" id="qeScoreRange" />
        <span class="score-num" id="qeScoreDisplay">90</span>
      </div>
      <button class="score-toggle-btn" id="qeScoreToggleBtn" type="button">점수 없음으로 표시</button>
    </div>

    <div class="field-group">
      <label class="field-label">태그</label>
      <div class="tag-select-wrap" id="qeTagSelectWrap"></div>
    </div>

    <div class="modal-actions">
      <button class="btn ghost" id="qeDetailBtn">상세수정</button>
      <button class="btn primary" id="qeSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- Tag Manager Modal -->
<div class="modal-backdrop" id="tagModalBackdrop">
  <div class="modal-sheet">
    <h2 class="modal-title">설정</h2>

    <div class="field-group">
      <label class="field-label">이름 / 닉네임</label>
      <input class="field-input" id="nicknameInput" placeholder="예: 소정" />
      <p style="font-size:11.5px; color: var(--text-faint); margin: 8px 0 0;">입력하면 제목이 "○○ 노래 리스트"으로 바뀌어요. 비워두면 "노래 리스트"</p>
    </div>

    <div style="height:1px; background: var(--hairline); margin: 22px 0 18px;"></div>

  function showToast(msg) {

  function uid() {

  // ---------- Storage (browser localStorage: works fully offline, no Claude needed) ----------
  function loadData() {
    try {
      const s = localStorage.getItem(SONGS_KEY);
      songs = s ? JSON.parse(s) : null;
    } catch (e) {
      songs = null;
    }
    let storedSeedVersion = null;
    try { storedSeedVersion = localStorage.getItem(SEED_VERSION_KEY); } catch (e) {}

    // 새 시드(엑셀 기준 목록)가 배포되면 한 번 강제로 목록을 갱신한다
    if (songs === null || storedSeedVersion !== SEED_VERSION) {
      songs = JSON.parse(JSON.stringify(DEFAULT_SONGS));
      saveSongs();
      try { localStorage.setItem(SEED_VERSION_KEY, SEED_VERSION); } catch (e) {}
    }
    // 예전 데이터 호환: 없는 필드 채우기
    songs.forEach(s => {
      if (typeof s.fav !== 'boolean') s.fav = false;
      if (typeof s.playCount !== 'number') s.playCount = 0;
      if (s.score === undefined) s.score = null;
      if (!Array.isArray(s.tagIds)) s.tagIds = [];
    });

    try { nickname = localStorage.getItem(NICKNAME_KEY) || ''; } catch (e) { nickname = ''; }

    let tagVersion = null;
    try {
      tags = JSON.parse(localStorage.getItem(TAGS_KEY) || 'null');
      tagVersion = localStorage.getItem(TAG_VERSION_KEY);
    } catch (e) {
      tags = null;
      tagVersion = null;
    }
    if (!tags || tagVersion !== TAG_SCHEMA_VERSION) {
      tags = DEFAULT_TAGS.slice();
      saveTags();
      try { localStorage.setItem(TAG_VERSION_KEY, TAG_SCHEMA_VERSION); } catch (e) {}
    }
    // 마이그레이션: 기존 저장 데이터의 태그 이름 '연습' → '연습중' (사용자 커스텀 태그는 보존)
    const legacyTag = tags.find(t => t.id === 't6' && t.name === '연습');
    if (legacyTag) { legacyTag.name = '연습중'; saveTags(); }
    // 마이그레이션: 평소/자랑용/분위기업/잔잔 태그의 기본 색상 갱신 (사용자가 직접 바꾼 색상은 보존)
    const OLD_DEFAULT_COLORS = { t1: '#f4c542', t2: '#ff5c7a', t3: '#4fc3e8', t4: '#7ed6a5' };
    const NEW_DEFAULT_COLORS = { t1: '#ff5fae', t2: '#ff3b3b', t3: '#ffd23f', t4: '#3b82f6' };
    let colorsChanged = false;
    tags.forEach(t => {
      if (OLD_DEFAULT_COLORS[t.id] && t.color === OLD_DEFAULT_COLORS[t.id]) {
        t.color = NEW_DEFAULT_COLORS[t.id];
        colorsChanged = true;
      }
    });
    if (colorsChanged) saveTags();
    render();
  }

  function saveSongs() {
    try {
      localStorage.setItem(SONGS_KEY, JSON.stringify(songs));
    } catch (e) {
      showToast('저장에 실패했어요. 저장 공간이 가득 찼을 수 있어요.');
    }
  }

  function saveTags() {
    try {
      localStorage.setItem(TAGS_KEY, JSON.stringify(tags));
    } catch (e) {
      showToast('태그 저장에 실패했어요.');
    }
  }

  function saveNickname() {
    try {
      localStorage.setItem(NICKNAME_KEY, nickname);
    } catch (e) {}
  }

  // 태그는 항상 설정된 태그 순서대로 정렬해서 저장/표시한다
  function sortTagIds(ids) {
    const order = {};
    tags.forEach((t, i) => { order[t.id] = i; });
    return Array.from(new Set(ids)).sort((a, b) => {
      const oa = (a in order) ? order[a] : 9999;
      const ob = (b in order) ? order[b] : 9999;
      return oa - ob;
    });
  }

  // ---------- Korean sorting helper ----------
  const CHO_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function getChosung(str) {
    if (!str) return '#';
    const code = str.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) return '#';
    return CHO_LIST[Math.floor(code / (21*28))];
  }
  // 정렬/그룹 우선순위: 숫자 -> 영어 -> 한글
  function getScriptGroup(title) {
    const ch = (title || '').trim().charAt(0);
    if (/[0-9]/.test(ch)) return 0;
    if (/[A-Za-z]/.test(ch)) return 1;
    return 2;
  }
  function getGroupLabel(title) {
    const ch = (title || '').trim().charAt(0);
    if (/[0-9]/.test(ch)) return '#';
    if (/[A-Za-z]/.test(ch)) return ch.toUpperCase();
    return getChosung(title);
  }

  function scoreColor(score) {
    if (score === null || score === undefined || isNaN(score)) return 'var(--text-faint)';
    if (score >= 95) return 'var(--score-high)';
    if (score >= 90) return 'var(--score-mid-high)';
    if (score >= 85) return 'var(--score-mid)';
    return 'var(--score-low)';
  }

  // ---------- Filter row ----------
  function renderFilterRow() {
    const row = $('#filterRow');
    row.innerHTML = '';
    const allChip = el('button', 'chip all' + (activeTagFilters.size === 0 ? ' active' : ''));
    allChip.textContent = '전체';
    allChip.onclick = () => { activeTagFilters.clear(); render(); };
    row.appendChild(allChip);

    const favChip = el('button', 'chip' + (favOnly ? ' active' : ''));
    favChip.style.setProperty('--chip-color', 'var(--accent-magenta)');
    favChip.textContent = favOnly ? '♥' : '♡';
    favChip.title = '하트 표시한 곡만 보기';
    favChip.onclick = () => { favOnly = !favOnly; render(); };
    row.appendChild(favChip);

    tags.forEach(tag => {
      const chip = el('button', 'chip' + (activeTagFilters.has(tag.id) ? ' active' : '') + (tag.lowFreq ? ' chip-subtle' : ''));
      chip.style.setProperty('--chip-color', tag.color);
      const dot = el('span', 'dot');
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(tag.name));
      chip.onclick = () => {
        if (activeTagFilters.has(tag.id)) activeTagFilters.delete(tag.id);
        else activeTagFilters.add(tag.id);
        render();
      };
      row.appendChild(chip);
    });
  }

  // ---------- Sort tabs ----------
  function renderSortTabs() {
    document.querySelectorAll('.sort-tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.sort === sortMode);
      btn.onclick = () => { sortMode = btn.dataset.sort; render(); };
    });
  }

  // ---------- Song list ----------
  function getFilteredSortedSongs() {
    let list = songs.slice();

    const q = searchQuery.trim().toLowerCase();
    if (q) {
      // 검색 중에는 태그 필터/저빈도 숨김과 무관하게 전체 목록에서 찾는다
      list = list.filter(s => {
        const tagNames = s.tagIds.map(id => { const t = tagById(id); return t ? t.name : ''; }).join(' ');
        const haystack = `${s.title} ${s.artist} ${s.key} ${tagNames}`.toLowerCase();
        return haystack.includes(q);
      });
      if (favOnly) list = list.filter(s => s.fav);
      return sortSongList(list);
    }

    if (activeTagFilters.size > 0) {
      const lowFreqTagIds = new Set(tags.filter(t => t.lowFreq).map(t => t.id));
      list = list.filter(s => {
        const matchesSelected = s.tagIds.some(id => activeTagFilters.has(id));
        if (!matchesSelected) return false;
        // 저빈도 태그(가끔/듀엣 등)가 붙은 곡은, 그 저빈도 태그 자체가 선택되었을 때만 표시
        const hasUnselectedLowFreq = s.tagIds.some(id => lowFreqTagIds.has(id) && !activeTagFilters.has(id));
        return !hasUnselectedLowFreq;
      });
    } else {
      // 전체 보기일 때는 저빈도 태그(가끔/듀엣 등 lowFreq로 표시된 태그)가 붙은 곡을 기본적으로 숨김
      const lowFreqTagIds = new Set(tags.filter(t => t.lowFreq).map(t => t.id));
      list = list.filter(s => !s.tagIds.some(id => lowFreqTagIds.has(id)));
    }
    if (favOnly) list = list.filter(s => s.fav);
    return sortSongList(list);
  }

  function sortSongList(list) {
    if (sortMode === 'alpha') {
      list.sort((a,b) => {
        const ga = getScriptGroup(a.title), gb = getScriptGroup(b.title);
        if (ga !== gb) return ga - gb;
        return a.title.localeCompare(b.title, 'ko');
      });
    } else if (sortMode === 'scoreDesc') {
      list.sort((a,b) => {
        const av = (a.score === null || a.score === undefined) ? null : a.score;
        const bv = (b.score === null || b.score === undefined) ? null : b.score;
        if (av === null && bv === null) return 0;
        if (av === null) return 1;
        if (bv === null) return -1;
        return bv - av;
      });
    } else if (sortMode === 'scoreAsc') {
      list.sort((a,b) => {
        const av = (a.score === null || a.score === undefined) ? null : a.score;
        const bv = (b.score === null || b.score === undefined) ? null : b.score;
        if (av === null && bv === null) return 0;
        if (av === null) return 1;
        if (bv === null) return -1;
        return av - bv;
      });
    } else if (sortMode === 'playDesc') {
      list.sort((a,b) => (b.playCount||0) - (a.playCount||0));
    }
    return list;
  }

  function tagById(id) { return tags.find(t => t.id === id); }

  function renderSongCard(song) {
    const card = el('div', 'song-card');
    card.onclick = () => openQuickEdit(song);

    const heartBtn = el('button', 'heart-btn' + (song.fav ? ' on' : ''));
    heartBtn.textContent = '♥';
    heartBtn.title = song.fav ? '하트 해제' : '하트 표시';
    heartBtn.onclick = (e) => {
      e.stopPropagation();
      song.fav = !song.fav;
      saveSongs();
      render();
    };

    const main = el('div', 'song-main');
    const title = el('p', 'song-title');
    title.textContent = song.title;
    const sub = el('p', 'song-sub');
    sub.innerHTML = `${escapeHtml(song.artist || '가수 미상')}${song.key ? ' · <span class="key">' + escapeHtml(song.key) + '</span>' : ''}`;
    const tagWrap = el('div', 'song-tags');
    sortTagIds(song.tagIds).forEach(tid => {
      const tag = tagById(tid);
      if (!tag) return;
      const pill = el('span', 'tag-pill');
      pill.style.setProperty('--pill-color', tag.color);
      pill.textContent = tag.name;
      tagWrap.appendChild(pill);
    });

    main.appendChild(title);
    main.appendChild(sub);
    main.appendChild(tagWrap);

    const scoreCol = el('div', 'score-col');
    const led = el('div', 'score-led');
    const hasScore = song.score !== null && song.score !== undefined;
    led.style.color = scoreColor(song.score);
    led.style.boxShadow = hasScore ? `0 0 14px ${scoreColor(song.score)}` : 'none';
    led.textContent = hasScore ? song.score : '−';
    const playBadge = el('div', 'play-badge');
    playBadge.textContent = (song.playCount || 0) + '회';
    scoreCol.appendChild(led);
    scoreCol.appendChild(playBadge);

    card.appendChild(heartBtn);
    card.appendChild(main);
    card.appendChild(scoreCol);
    return card;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderList() {
    const wrap = $('#listWrap');
    wrap.innerHTML = '';
    const list = getFilteredSortedSongs();

    if (songs.length === 0) {
      const empty = el('div', 'empty-state');
      empty.innerHTML = `<div class="emoji">🎤</div><div class="msg1">아직 등록된 노래가 없어요</div><div class="msg2">오른쪽 아래 + 버튼으로 첫 애창곡을 추가해보세요</div>`;
      wrap.appendChild(empty);
      return;
    }
    if (list.length === 0) {
      const empty = el('div', 'empty-state');
      const msg2 = searchQuery.trim()
        ? '다른 검색어로 찾아보세요'
        : (favOnly ? '하트 표시한 곡이 아직 없어요' : '다른 태그를 선택해보세요');
      empty.innerHTML = `<div class="emoji">🔍</div><div class="msg1">조건에 맞는 노래가 없어요</div><div class="msg2">${msg2}</div>`;
      wrap.appendChild(empty);
      return;
    }

    list.forEach(song => wrap.appendChild(renderSongCard(song)));
  }

  function updateHeader() {
    $('#titleText').textContent = nickname ? `${nickname} 노래 리스트` : '노래 리스트';

    $('#songCount').textContent = (shown === songs.length)
      ? `${songs.length}곡`
      : `${shown} / ${songs.length}곡`;
  }

    $('#searchClearBtn').style.display = searchQuery ? 'block' : 'none';
  }

  function render() {
    renderFilterRow();
    renderSortTabs();
    renderList();
    updateHeader();
    updateSearchUI();

  function renderTagSelectWrap() {
    const wrap = $('#tagSelectWrap');

      chip.onclick = () => {
        if (selectedTagIdsInModal.has(tag.id)) selectedTagIdsInModal.delete(tag.id);

      wrap.appendChild(chip);

  function openSongModal(song) {
    editingSongId = song ? song.id : null;
    $('#songModalTitle').textContent = song ? '상세수정' : '노래 추가';
    $('#inputTitle').value = song ? song.title : '';
    $('#inputArtist').value = song ? song.artist : '';
    $('#inputKey').value = song ? song.key : '';
    const hasScore = song && song.score !== null && song.score !== undefined;
    $('#inputScoreRange').value = hasScore ? song.score : 90;
    $('#scoreNumDisplay').textContent = hasScore ? song.score : 90;
    $('#scoreNumDisplay').style.color = scoreColor(hasScore ? song.score : 90);
    setScoreRowUnset($('#scoreFieldRow'), $('#scoreToggleBtn'), song ? !hasScore : false);
    selectedTagIdsInModal = new Set(song ? song.tagIds : []);
    $('#deleteSongBtn').style.display = song ? 'block' : 'none';
    renderTagSelectWrap();
    $('#songModalBackdrop').classList.add('open');
  }

  function closeSongModal() {
    $('#songModalBackdrop').classList.remove('open');
    editingSongId = null;
  }

  async function handleSaveSong() {
    const title = $('#inputTitle').value.trim();
    const artist = $('#inputArtist').value.trim();
    const key = $('#inputKey').value.trim();
    const scoreUnset = $('#scoreFieldRow').classList.contains('is-unset');
    const score = scoreUnset ? null : parseInt($('#inputScoreRange').value, 10);

    if (!title) {
      showToast('제목을 입력해주세요');
      return;
    }

    if (editingSongId) {
      const song = songs.find(s => s.id === editingSongId);
      song.title = title;
      song.artist = artist;
      song.key = key;
      song.score = score;
      song.tagIds = sortTagIds(Array.from(selectedTagIdsInModal));
    } else {
      songs.push({
        id: uid(),
        title, artist, key, score,
        tagIds: sortTagIds(Array.from(selectedTagIdsInModal)),
        playCount: 0,
        fav: false
      });
    }
    await saveSongs();
    closeSongModal();
    render();
    showToast('저장했어요');
  }

  async function handleDeleteSong() {
    if (!editingSongId) return;
    songs = songs.filter(s => s.id !== editingSongId);
    await saveSongs();
    closeSongModal();
    render();
    showToast('삭제했어요');
  }

  // ---------- Quick Edit Modal (부른 횟수 / 점수 / 태그) ----------
  let qeSongId = null;
  let qeCount = 0;
  let qeSelectedTagIds = new Set();

  function renderQeTagSelectWrap() {
    const wrap = $('#qeTagSelectWrap');
    wrap.innerHTML = '';
    tags.forEach(tag => {
      const chip = el('span', 'tag-check' + (qeSelectedTagIds.has(tag.id) ? ' checked' : ''));
      chip.style.setProperty('--chk-color', tag.color);
      chip.textContent = tag.name;
      chip.onclick = () => {
        if (qeSelectedTagIds.has(tag.id)) qeSelectedTagIds.delete(tag.id);
        else qeSelectedTagIds.add(tag.id);
        renderQeTagSelectWrap();
      };
      wrap.appendChild(chip);
    });
  }

  function openQuickEdit(song) {
    qeSongId = song.id;
    qeCount = song.playCount || 0;
    $('#quickEditTitle').textContent = song.title;
    $('#qeCountDisplay').textContent = qeCount;
    const hasScore = song.score !== null && song.score !== undefined;
    $('#qeScoreRange').value = hasScore ? song.score : 90;
    $('#qeScoreDisplay').textContent = hasScore ? song.score : 90;
    $('#qeScoreDisplay').style.color = scoreColor(hasScore ? song.score : 90);
    setScoreRowUnset($('#qeScoreFieldRow'), $('#qeScoreToggleBtn'), !hasScore);
    qeSelectedTagIds = new Set(song.tagIds);
    renderQeTagSelectWrap();
    $('#quickEditBackdrop').classList.add('open');
  }

  function closeQuickEdit() {
    $('#quickEditBackdrop').classList.remove('open');
    qeSongId = null;
  }

  async function handleQuickSave() {
    const song = songs.find(s => s.id === qeSongId);
    if (!song) { closeQuickEdit(); return; }
    const scoreUnset = $('#qeScoreFieldRow').classList.contains('is-unset');
    song.playCount = qeCount;
    song.score = scoreUnset ? null : parseInt($('#qeScoreRange').value, 10);
    song.tagIds = sortTagIds(Array.from(qeSelectedTagIds));
    await saveSongs();
    closeQuickEdit();
    render();
    showToast('저장했어요');
  }

  // ---------- Tag Manager Modal ----------
  function renderTagManageList() {
    const wrap = $('#tagManageList');
    wrap.innerHTML = '';
    tags.forEach(tag => {
      const row = el('div', 'tag-manage-row');
      const dot = el('span', 'color-dot');
      dot.style.setProperty('--dot-color', tag.color);
      const input = el('input', 'field-input');
      input.value = tag.name;
      input.style.flex = '1';
      input.onchange = async () => {
        tag.name = input.value.trim() || tag.name;
        await saveTags();
        render();
      };
      const lowFreqBtn = el('button', 'icon-btn');
      lowFreqBtn.textContent = tag.lowFreq ? '🔉' : '🔊';
      lowFreqBtn.title = tag.lowFreq ? '가끔 사용하는 태그 (눌러서 해제)' : '자주 쓰는 태그 (눌러서 "가끔 사용"으로 표시)';
      lowFreqBtn.style.opacity = tag.lowFreq ? '0.6' : '1';
      lowFreqBtn.onclick = async () => {
        tag.lowFreq = !tag.lowFreq;
        await saveTags();
        renderTagManageList();
        render();
      };
      const removeBtn = el('button', 'icon-btn remove');
      removeBtn.textContent = '✕';
      removeBtn.title = '태그 삭제';
      removeBtn.onclick = async () => {
        const inUse = songs.some(s => s.tagIds.includes(tag.id));
        if (inUse && !confirm(`"${tag.name}" 태그가 붙은 노래가 있어요. 그래도 삭제할까요?`)) return;
        tags = tags.filter(t => t.id !== tag.id);
        songs.forEach(s => { s.tagIds = s.tagIds.filter(id => id !== tag.id); });
        await saveTags();
        await saveSongs();
        renderTagManageList();
        render();
      };
      row.appendChild(dot);
      row.appendChild(input);
      row.appendChild(lowFreqBtn);
      row.appendChild(removeBtn);
      wrap.appendChild(row);
    });
  }

  let newTagColor = PALETTE[0];
  function renderNewTagSwatches() {
    const wrap = $('#newTagSwatches');
    wrap.innerHTML = '';
    PALETTE.forEach(color => {
      const sw = el('span', 'swatch' + (color === newTagColor ? ' selected' : ''));
      sw.style.background = color;
      sw.onclick = () => { newTagColor = color; renderNewTagSwatches(); };
      wrap.appendChild(sw);
    });
  }

  async function handleAddTag() {
    const name = $('#newTagName').value.trim();
    if (!name) {
      showToast('태그 이름을 입력해주세요');
      return;
    }
    const lowFreq = $('#newTagLowFreq').checked;
    tags.push({ id: uid(), name, color: newTagColor, lowFreq });
    await saveTags();
    $('#newTagName').value = '';
    $('#newTagLowFreq').checked = false;
    renderTagManageList();
    render();
    showToast('태그를 추가했어요');
  }

  // ---------- Excel export / import ----------
  function handleExportExcel() {
    if (songs.length === 0) {
      showToast('내보낼 노래가 없어요');
      return;
    }
    const rows = songs.map(s => ({
      '제목': s.title,
      '가수': s.artist,
      '키 변화': s.key,
      '태그': sortTagIds(s.tagIds).map(id => { const t = tagById(id); return t ? t.name : null; }).filter(Boolean).join(', '),
      '점수': (s.score === null || s.score === undefined) ? '' : s.score,
      '부른 횟수': s.playCount || 0,
      '하트': s.fav ? 'O' : ''
    }));
    const ws = XLSX.utils.json_to_sheet(rows, { header: ['제목','가수','키 변화','태그','점수','부른 횟수','하트'] });
    ws['!cols'] = [{wch:20},{wch:14},{wch:14},{wch:24},{wch:8},{wch:10},{wch:6}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '내 애창곡');
    XLSX.writeFile(wb, '내_애창곡_리스트.xlsx');
    showToast('엑셀 파일을 내려받았어요');
  }

  function splitTagNames(raw) {
    return String(raw || '')
      .split(/[,\/·、;]+/)
      .map(t => t.trim())
      .filter(Boolean);
  }

  function getOrCreateTag(name) {
    let tag = tags.find(t => t.name === name);
    if (!tag) {
      tag = { id: uid(), name, color: PALETTE[tags.length % PALETTE.length] };
      tags.push(tag);
    }
    return tag;
  }

  async function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

        if (!rows.length) {
          showToast('시트에서 데이터를 찾지 못했어요');
          return;
        }

        const newSongs = [];
        rows.forEach(row => {
          const title = String(row['제목'] ?? row['title'] ?? row['Title'] ?? '').trim();
          if (!title) return;
          const artist = String(row['가수'] ?? row['artist'] ?? row['Artist'] ?? '').trim();
          const key = String(row['키 변화'] ?? row['키'] ?? row['key'] ?? '').trim();
          const scoreRaw = row['점수'] ?? row['score'] ?? row['Score'];
          const parsedScore = parseInt(scoreRaw, 10);
          const score = !isNaN(parsedScore) ? Math.min(100, Math.max(0, parsedScore)) : null;
          const tagNames = splitTagNames(row['태그'] ?? row['tags'] ?? row['Tags'] ?? '');
          const tagIds = sortTagIds(tagNames.map(name => getOrCreateTag(name).id));
          const playCountRaw = row['부른 횟수'] ?? row['부른횟수'] ?? row['playCount'] ?? row['Play Count'];
          const parsedPlayCount = parseInt(playCountRaw, 10);
          const playCount = !isNaN(parsedPlayCount) && parsedPlayCount >= 0 ? parsedPlayCount : 0;
          const favRaw = String(row['하트'] ?? row['좋아요'] ?? row['fav'] ?? row['Favorite'] ?? '').trim().toLowerCase();
          const fav = ['o','O','y','yes','true','1','v','♥','y'].includes(favRaw);

          newSongs.push({ id: uid(), title, artist, key, score, tagIds, playCount, fav });
        });

        if (newSongs.length === 0) {
          showToast('가져올 수 있는 곡이 없어요. "제목" 열이 있는지 확인해주세요');
          return;
        }

        const confirmed = confirm(`현재 목록 ${songs.length}곡을 지우고, 엑셀의 ${newSongs.length}곡으로 전체 교체할까요?`);
        if (!confirmed) {
          return;
        }

        songs = newSongs;
        await saveTags();
        await saveSongs();
        render();
        showToast(`${newSongs.length}곡으로 전체 교체했어요`);
      } catch (err) {
        showToast('파일을 읽지 못했어요. 형식을 확인해주세요');
      } finally {
        e.target.value = '';
      }
    };
    reader.onerror = () => showToast('파일을 읽지 못했어요');
    reader.readAsArrayBuffer(file);
  }

  // ---------- Event bindings ----------
  $('#exportBtn').onclick = handleExportExcel;
  $('#importBtn').onclick = () => $('#importFileInput').click();
  $('#importFileInput').onchange = handleImportFile;

  $('#addBtn').onclick = () => openSongModal(null);
  $('#cancelSongBtn').onclick = closeSongModal;
  $('#saveSongBtn').onclick = handleSaveSong;
  $('#deleteSongBtn').onclick = handleDeleteSong;
  $('#songModalBackdrop').onclick = (e) => { if (e.target.id === 'songModalBackdrop') closeSongModal(); };

  $('#inputScoreRange').oninput = (e) => {
    $('#scoreNumDisplay').textContent = e.target.value;
    $('#scoreNumDisplay').style.color = scoreColor(parseInt(e.target.value,10));
  };
  $('#scoreToggleBtn').onclick = () => {
    const nowUnset = !$('#scoreFieldRow').classList.contains('is-unset');
    setScoreRowUnset($('#scoreFieldRow'), $('#scoreToggleBtn'), nowUnset);
  };

  $('#qeIncBtn').onclick = () => {
    qeCount = qeCount + 1;
    $('#qeCountDisplay').textContent = qeCount;
  };
  $('#qeDecBtn').onclick = () => {
    qeCount = Math.max(0, qeCount - 1);
    $('#qeCountDisplay').textContent = qeCount;
  };
  $('#qeScoreRange').oninput = (e) => {
    $('#qeScoreDisplay').textContent = e.target.value;
    $('#qeScoreDisplay').style.color = scoreColor(parseInt(e.target.value,10));
  };
  $('#qeScoreToggleBtn').onclick = () => {
    const nowUnset = !$('#qeScoreFieldRow').classList.contains('is-unset');
    setScoreRowUnset($('#qeScoreFieldRow'), $('#qeScoreToggleBtn'), nowUnset);
  };
  $('#qeSaveBtn').onclick = handleQuickSave;
  $('#qeDetailBtn').onclick = () => {
    const song = songs.find(s => s.id === qeSongId);
    closeQuickEdit();
    if (song) openSongModal(song);
  };
  $('#quickEditBackdrop').onclick = (e) => { if (e.target.id === 'quickEditBackdrop') closeQuickEdit(); };

  $('#searchInput').oninput = (e) => {
    searchQuery = e.target.value;
    render();
  };
  $('#searchClearBtn').onclick = () => {
    searchQuery = '';
    $('#searchInput').value = '';
    render();
  };

  $('#nicknameInput').oninput = (e) => {
    nickname = e.target.value.trim();
    saveNickname();
    updateHeader();
  };

  $('#gearBtn').onclick = () => {
    $('#nicknameInput').value = nickname;
    renderTagManageList();
    renderNewTagSwatches();
    $('#tagModalBackdrop').classList.add('open');
  };
  $('#closeTagModalBtn').onclick = () => $('#tagModalBackdrop').classList.remove('open');
  $('#tagModalBackdrop').onclick = (e) => { if (e.target.id === 'tagModalBackdrop') $('#tagModalBackdrop').classList.remove('open'); };
  $('#addTagBtn').onclick = handleAddTag;

  loadData();
})();
</script>
<script>
// PWA: 서비스 워커 등록 (https 호스팅 시 오프라인 지원 + 앱 설치 가능)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
